[project]
name = "live-translate"
version = "0.1.0"
description = "Live EN<->TR subtitles for Python Pizza Istanbul, served as an OBS browser source"
readme = "README.md"
authors = [
    { name = "egeakman", email = "me@egeakman.dev" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "ctranslate2>=4.8.5",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "mlx>=0.32.4",
    "mlx-lm>=0.32.2",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "pydantic>=2.14.3",
    "pyobjc-framework-avfoundation>=13.0",
    "rapidfuzz>=3.14.6",
    "sacremoses>=0.2.0",
    "sentencepiece>=0.2.3",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
live-translate = "live_translate.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
bench = [
    "jiwer>=4.0.0",
    "sacrebleu>=2.6.0",
]
dev = [
    "pytest>=9.2.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev", "bench"]
